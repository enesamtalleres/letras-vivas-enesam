<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letras Vivas | ENESAM</title><style>
:root{--ink:#322821;--muted:#796c64;--paper:#fbf8f2;--cream:#f3ece0;--white:#fff;--wine:#782f47;--wine2:#9d4b60;--border:#e6d9cb;--green:#276b54;--shadow:0 12px 40px #39201412}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}h1,h2,h3,p{margin-top:0}h1,h2,.serif{font-family:Georgia,serif}h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.12}h2{font-size:1.8rem}h3{font-size:1.15rem}small,.muted{color:var(--muted)}.app{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 0 24px}.brand{display:flex;gap:12px;align-items:center;font-family:Georgia,serif;font-weight:bold;font-size:1.24rem;color:var(--wine)}.logo{background:var(--wine);color:white;border-radius:14px;padding:10px;font:25px Georgia,serif}.pill{background:var(--cream);border:1px solid var(--border);border-radius:30px;padding:7px 12px;color:var(--muted);font-size:.85rem}.hero{background:linear-gradient(110deg,#fff9ee,#f4e7dd);border:1px solid var(--border);border-radius:26px;padding:clamp(28px,5vw,62px);box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'❦';position:absolute;font:220px Georgia,serif;color:#b78d7650;right:0;bottom:-125px;pointer-events:none}.eyebrow{font-size:.73rem;letter-spacing:.18em;font-weight:800;color:var(--wine);text-transform:uppercase}.lead{font-size:1.1rem;max-width:660px;color:#66564d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.cards{margin-top:22px}.home-actions{margin-top:15px;display:flex;justify-content:flex-end}.quiet{font-size:.78rem;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:7px}.quiet:hover{color:var(--wine)}details.minor{margin:10px 0;color:var(--muted)}details.minor summary{cursor:pointer;font-size:.84rem}details.minor inp
